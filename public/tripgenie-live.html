<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0;url=/?agent=demo" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TripGenie Live Demo - AI-powered travel planning. Search flights, hotels, trains and get the best deals instantly." />
    <title>TripGenie Live Demo</title>
    <style>
      body { background: #0a0a0a; color: #fafafa; font-family: 'Outfit', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
      .loader { text-align: center; }
      .loader h1 { font-size: 2rem; margin-bottom: 0.5rem; }
      .loader p { color: #999; }
      .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #ff6b35; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 1rem auto; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="loader">
      <h1>TripGenie</h1>
      <div class="spinner"></div>
      <p>Loading your AI travel assistant...</p>
    </div>
    <script>
      // Redirect to main app with demo flag
      const params = new URLSearchParams(window.location.search);
      const target = '/' + (params.toString() ? '?' + params.toString() : '?agent=demo');
      window.location.replace(target);
    </script>
  </body>
</html>
